<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peta Wisata Pidie Jaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sea-deep:#0e5872; --sea-light:#3f9bbd; --sea-foam:#bfe4ea;
  --land-base:#7ea45a; --land-mid:#5c8b45; --land-dark:#3c5f30;
  --sand:#e8d9ac; --ink:#22303a; --ink-soft:#5b6b70;
  --card:#fbf7ee; --card-2:#f2ecdc;
  --accent:#c1622f; --accent-dark:#9c4c22; --gold:#d9a441;
  --cat-museum:#c1442e; --cat-pantai:#d9a441; --cat-alam:#4c8c4a; --cat-sejarah:#7b4b94; --cat-taman:#3c7ca6;
  --r-lg:22px; --r-md:14px; --r-sm:9px;
  --shadow-1:0 2px 10px rgba(20,30,35,.14), 0 1px 3px rgba(20,30,35,.10);
  --shadow-2:0 20px 55px rgba(15,25,30,.28), 0 6px 18px rgba(15,25,30,.16);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--sea-deep);
  color:var(--ink);
}
.font-display{font-family:'Fraunces',serif}

/* ===== STAGE ===== */
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
#mapWrap{
  width:100%;height:100%;
  background:radial-gradient(ellipse at 50% 20%, var(--sea-light), var(--sea-deep) 78%);
}
#mapSvg{width:100%;height:100%;display:block}

.pin{cursor:pointer}
.pin-anim{transform-box:fill-box;transform-origin:center;animation:pinPop .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pinPop{0%{transform:scale(0) translateY(6px);opacity:0}60%{transform:scale(1.12) translateY(-2px);opacity:1}100%{transform:scale(1) translateY(0);opacity:1}}
.pin:hover .pin-body{filter:brightness(1.08)}
.pin-body{transition:transform .18s ease;transform-box:fill-box;transform-origin:center}
.pin:hover .pin-body{transform:scale(1.1)}
.pin-shadow{opacity:.28}
.pin-origin-ring{animation:ringPulse 2.2s ease-out infinite}
@keyframes ringPulse{0%{r:11;opacity:.55}70%{r:24;opacity:0}100%{r:24;opacity:0}}

/* ===== HEADER ===== */
.header{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:60;
  background:var(--card);border-radius:30px;
  padding:9px 20px 9px 12px;display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow-1); white-space:nowrap;
}
.h-badge-icon{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;
}
.h-title{font-family:'Fraunces',serif;font-weight:600;font-size:15.5px;color:var(--ink);line-height:1.1}
.h-sub{font-size:11px;color:var(--ink-soft);margin-top:2px;letter-spacing:.2px}
.h-sep{width:1px;height:26px;background:#e2dcc8}
.h-count{font-size:12px;font-weight:700;color:var(--accent-dark);background:#f6e6da;padding:5px 12px;border-radius:14px}

/* ===== TOOLBAR (download) ===== */
.toolbar{position:fixed;top:16px;right:16px;z-index:60;display:flex;gap:8px}
.tbtn{
  background:var(--card);border:none;border-radius:14px;padding:10px 14px;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:700;color:var(--ink);
  display:flex;align-items:center;gap:6px;cursor:pointer;box-shadow:var(--shadow-1);
  transition:transform .15s, background .15s;
}
.tbtn:hover{transform:translateY(-2px);background:#fff}
.tbtn.primary{background:var(--accent);color:#fff}
.tbtn.primary:hover{background:var(--accent-dark)}

/* ===== LEGEND ===== */
.legend{
  position:fixed;left:16px;bottom:16px;z-index:60;
  background:var(--card);border-radius:var(--r-lg);
  width:238px;max-height:min(58vh,460px);
  box-shadow:var(--shadow-1);display:flex;flex-direction:column;overflow:hidden;
}
.legend-head{padding:14px 16px 10px;border-bottom:1px solid #e9e2cf}
.legend-head .lg-title{font-family:'Fraunces',serif;font-weight:600;font-size:14px;color:var(--ink)}
.legend-head .lg-sub{font-size:10.5px;color:var(--ink-soft);margin-top:2px}
.legend-body{overflow-y:auto;padding:8px 8px 12px}
.legend-body::-webkit-scrollbar{width:5px}
.legend-body::-webkit-scrollbar-thumb{background:#d8cfb4;border-radius:6px}
.lg-group{margin-top:6px}
.lg-group-title{
  font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;
  color:var(--ink-soft);padding:6px 8px 4px;display:flex;align-items:center;gap:6px;
}
.lg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.lg-item{
  display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:10px;cursor:pointer;
  transition:background .15s;
}
.lg-item:hover{background:var(--card-2)}
.lg-num{
  width:19px;height:19px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;color:#fff;
}
.lg-name{font-size:12px;font-weight:600;color:var(--ink);line-height:1.25}

/* ===== OVERLAY / COMPACT MODAL ===== */
.overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(15,25,30,.32);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:18px;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.overlay.on{opacity:1;pointer-events:all}
.modal{
  width:100%;max-width:360px;background:var(--card);border-radius:var(--r-lg);overflow:hidden;
  box-shadow:var(--shadow-2);
  transform:scale(.88) translateY(22px);transition:transform .4s cubic-bezier(.34,1.56,.64,1);
}
.overlay.on .modal{transform:scale(1) translateY(0)}
.m-img-wrap{position:relative;height:170px;overflow:hidden;background:var(--land-mid)}
.m-img-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.m-grad{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 50%,rgba(15,25,30,.55))}
.m-cat{position:absolute;top:11px;left:11px;background:rgba(255,255,255,.94);border-radius:20px;padding:4px 11px;font-size:11px;font-weight:700;color:var(--ink)}
.m-close{
  position:absolute;top:9px;right:9px;width:30px;height:30px;border:none;border-radius:50%;
  background:rgba(255,255,255,.92);cursor:pointer;font-size:14px;color:var(--ink);
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.2);
}
.m-loc{position:absolute;bottom:10px;left:11px;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.94);border-radius:10px;padding:4px 9px;font-size:11px;font-weight:700;color:var(--ink)}
.m-body{padding:16px 17px 18px}
.m-name{font-family:'Fraunces',serif;font-weight:600;font-size:18px;color:var(--ink);line-height:1.25;margin-bottom:4px}
.m-addr{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;margin-bottom:12px}
.m-rating{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--ink);background:var(--card-2);border-radius:10px;padding:4px 9px;margin-bottom:14px}
.m-rating .st{color:var(--gold)}
.m-actions{display:flex;gap:9px}
.btn-explore{
  flex:1;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:13px;
  font-size:13px;font-weight:800;letter-spacing:.2px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
  transition:background .2s, transform .15s;
}
.btn-explore:hover{background:var(--accent-dark);transform:translateY(-1px)}

/* ===== DETAIL PANEL ===== */
.detail{
  position:fixed;inset:0;z-index:300;background:var(--card);
  transform:translateY(100%);transition:transform .48s cubic-bezier(.22,1,.36,1);
  overflow-y:auto;
}
.detail.on{transform:translateY(0)}
.d-hero{position:relative;height:min(42vh,340px);overflow:hidden;background:var(--land-mid)}
.d-hero img{width:100%;height:100%;object-fit:cover}
.d-hero-grad{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(15,25,30,.15),rgba(15,25,30,.65))}
.d-back{
  position:fixed;top:16px;left:16px;z-index:340;width:42px;height:42px;border-radius:50%;border:none;
  background:rgba(255,255,255,.95);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-1);
}
.d-hero-info{position:absolute;left:24px;right:24px;bottom:20px;color:#fff}
.d-hero-cat{display:inline-block;background:rgba(255,255,255,.22);backdrop-filter:blur(4px);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;margin-bottom:10px}
.d-hero-name{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(22px,4vw,32px);line-height:1.15}
.d-body{max-width:760px;margin:0 auto;padding:26px 22px 60px}
.d-metarow{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:22px}
.d-chip{background:var(--card-2);border-radius:12px;padding:8px 13px;font-size:12px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px}
.d-chip.gold{background:#f6ecd7;color:var(--accent-dark)}
.d-sec{margin-bottom:26px}
.d-sec-title{font-family:'Fraunces',serif;font-weight:600;font-size:16.5px;color:var(--ink);margin-bottom:9px;display:flex;align-items:center;gap:8px}
.d-sec-title .dash{width:20px;height:2.5px;background:var(--accent);border-radius:2px}
.d-sec-text{font-size:13.5px;line-height:1.75;color:#3c4a51}
.d-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.d-gallery img{width:100%;height:118px;object-fit:cover;border-radius:12px;cursor:pointer;transition:transform .2s}
.d-gallery img:hover{transform:scale(1.03)}
@media (max-width:520px){.d-gallery{grid-template-columns:repeat(2,1fr)}.d-gallery img{height:130px}}

/* toast */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:400;
  background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:10px 20px;border-radius:24px;
  opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap;
}
.toast.on{opacity:1}

/* ===== LIGHTBOX (photo viewer inside gallery) ===== */
.lightbox{
  position:fixed;inset:0;z-index:500;background:rgba(10,16,20,.92);
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .28s;
}
.lightbox.on{opacity:1;pointer-events:all}
.lightbox img{max-width:min(92vw,900px);max-height:82vh;object-fit:contain;border-radius:12px;box-shadow:var(--shadow-2)}
.lb-close{
  position:fixed;top:16px;right:16px;z-index:520;width:42px;height:42px;border-radius:50%;border:none;
  background:rgba(255,255,255,.95);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-1);
}
.lb-nav{
  position:fixed;top:50%;transform:translateY(-50%);z-index:520;width:44px;height:44px;border-radius:50%;border:none;
  background:rgba(255,255,255,.92);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-1);
}
.lb-prev{left:16px}
.lb-next{right:16px}
.lb-counter{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:520;
  background:rgba(255,255,255,.92);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;color:var(--ink);
}
.lg-icon{
  position:relative;
  width:24px;height:24px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:13px; color:#fff;
}
.lg-icon .lg-badge-num{
  position:absolute; right:-4px; bottom:-4px;
  width:14px;height:14px;border-radius:50%;
  background:#fff; color:var(--ink);
  font-size:8px; font-weight:800;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 2px rgba(0,0,0,.25);
}
</style>
</head>
<body>

<div class="header">
  <div class="h-badge-icon">🗺️</div>
  <div>
    <div class="h-title">Peta Wisata Pidie Jaya</div>
    <div class="h-sub">Kabupaten Pidie Jaya · Aceh</div>

</div>

<div class="toolbar">
  <button class="tbtn" id="btnJpg">⬇ JPG</button>

</div>

<div class="stage"><div id="mapWrap"><svg id="mapSvg" xmlns="http://www.w3.org/2000/svg"></svg></div></div>

<div class="legend">
  <div class="legend-head">
    <div class="lg-title">Legenda Destinasi</div>
    <div class="lg-sub">Klik nama untuk melihat lokasi</div>
    <div style="display:flex;flex-direction:column;gap:5px;margin-top:9px">
      <div style="display:flex;align-items:center;gap:8px"><svg width="20" height="6"><line x1="0" y1="3" x2="20" y2="3" stroke="#181818" stroke-width="5"/><line x1="0" y1="3" x2="20" y2="3" stroke="#fff" stroke-width="1" stroke-dasharray="3,3"/></svg><span style="font-size:11px;font-weight:600;color:var(--ink-soft)">🛣️ Jalan Lintas / Jalan Besar</span></div>
      <div style="display:flex;align-items:center;gap:8px"><svg width="20" height="6"><line x1="0" y1="3" x2="20" y2="3" stroke="#3f9bbd" stroke-width="3"/></svg><span style="font-size:11px;font-weight:600;color:var(--ink-soft)">🌊 Aliran Sungai</span></div>
    </div>
  </div>
  <div class="legend-body" id="legendBody"></div>
</div>

<div class="toast" id="toast"></div>

<!-- COMPACT MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="m-img-wrap">
      <img id="mImg" src="" alt="">
      <div class="m-grad"></div>
      <span class="m-cat" id="mCat"></span>
      <button class="m-close" id="btnCloseModal">✕</button>
      <div class="m-loc">📍 Titik lokasi ditandai di peta</div>
    </div>
    <div class="m-body">
      <div class="m-name" id="mName"></div>
      <div class="m-addr">📍 <span id="mAddr"></span></div>
      <div class="m-rating" id="mRating"></div>
      <div class="m-actions">
        <button class="btn-explore" id="btnExplore"><span>🔎</span> Explore</button>
      </div>
    </div>
  </div>
</div>

<!-- DETAIL PANEL -->
<button class="d-back" id="btnBack" style="display:none">←</button>
<div class="detail" id="detail">
  <div class="d-hero">
    <img id="dHeroImg" src="" alt="">
    <div class="d-hero-grad"></div>
    <div class="d-hero-info">
      <span class="d-hero-cat" id="dCat"></span>
      <div class="d-hero-name" id="dName"></div>
    </div>
  </div>
  <div class="d-body">
    <div class="d-metarow" id="dMeta"></div>
    <div class="d-sec">
      <div class="d-sec-title"><span class="dash"></span>Lokasi & Rute</div>
      <div class="d-sec-text" id="dRoute"></div>
    </div>
    <div class="d-sec">
      <div class="d-sec-title"><span class="dash"></span>Sejarah</div>
      <div class="d-sec-text" id="dSejarah"></div>
    </div>
    <div class="d-sec">
      <div class="d-sec-title"><span class="dash"></span>Detail</div>
      <div class="d-sec-text" id="dDetail"></div>
    </div>
    <div class="d-sec">
      <div class="d-sec-title"><span class="dash"></span>Galeri Foto</div>
      <div class="d-gallery" id="dGallery"></div>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<button class="lb-close" id="lbClose" style="display:none">✕</button>
<button class="lb-nav lb-prev" id="lbPrev" style="display:none">‹</button>
<button class="lb-nav lb-next" id="lbNext" style="display:none">›</button>
<div class="lightbox" id="lightbox">
  <img id="lbImg" src="" alt="">
</div>
<div class="lb-counter" id="lbCounter" style="display:none"></div>

// ══════════════════════════════════ PROJECTION ══════════════════════════════════
const W=900, H=1020, PAD=20;
const ring = pidieJayaGeoJSON.features[0].geometry.coordinates[0];
let minLat=90,maxLat=-90,minLng=180,maxLng=-180;
ring.forEach(([lng,lat])=>{ if(lat<minLat)minLat=lat; if(lat>maxLat)maxLat=lat; if(lng<minLng)minLng=lng; if(lng>maxLng)maxLng=lng; });
const lonScale = Math.cos((minLat+maxLat)/2*Math.PI/180);
const spanX=(maxLng-minLng)*lonScale, spanY=(maxLat-minLat);
const scale = Math.min((W-2*PAD)/spanX,(H-2*PAD)/spanY);
const usedW=spanX*scale, usedH=spanY*scale;
const offX = (W-usedW)/2, offY=(H-usedH)/2;
function project(lat,lng){
  const x = offX + (lng-minLng)*lonScale*scale;
  const y = offY + (maxLat-lat)*scale;
  return [x,y];
}
const landPts = ring.map(([lng,lat])=>project(lat,lng));
const landD = "M"+landPts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join("L")+"Z";
function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function bearingDir(lat1,lon1,lat2,lon2){
  const toRad=d=>d*Math.PI/180, toDeg=r=>r*180/Math.PI;
  const y=Math.sin(toRad(lon2-lon1))*Math.cos(toRad(lat2));
  const x=Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) - Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(toRad(lon2-lon1));
  const brng=(toDeg(Math.atan2(y,x))+360)%360;
  const dirs=['Utara','Timur Laut','Timur','Tenggara','Selatan','Barat Daya','Barat','Barat Laut'];
  return dirs[Math.round(brng/45)%8];
}

// helper: smooth path through a list of [x,y] points
function smoothPath(points){
  if(points.length<2) return '';
  let d = `M${points[0][0].toFixed(1)},${points[0][1].toFixed(1)}`;
  for(let i=1;i<points.length;i++){
    const [x0,y0]=points[i-1], [x1,y1]=points[i];
    const mx=(x0+x1)/2, my=(y0+y1)/2;
    d += ` Q${x0.toFixed(1)},${y0.toFixed(1)} ${mx.toFixed(1)},${my.toFixed(1)}`;
  }
  const last=points[points.length-1];
  d += ` T${last[0].toFixed(1)},${last[1].toFixed(1)}`;
  return d;
}
function byId(id){ return places.find(p=>p.id===id); }
function pt(p){ return project(p.lat,p.lng); }

// Build a winding (non-straight) chain of waypoints between two points,
// so roads meander like a real cross-country highway instead of cutting
// directly through the land. Endpoints stay fixed; the path bows out
// laterally in the middle using a couple of sine bumps.
function windSegment(x0,y0,x1,y1,segments,ampBase,seed){
  const dx=x1-x0, dy=y1-y0;
  const len=Math.hypot(dx,dy);
  const nx = len ? -dy/len : 0, ny = len ? dx/len : 0;
  const amp = Math.min(ampBase, len*0.22);
  const pts=[];
  for(let i=0;i<=segments;i++){
    const t=i/segments;
    const bx=x0+dx*t, by=y0+dy*t;
    // taper the offset to 0 at both ends so segments join cleanly at cities
    const taper = Math.sin(t*Math.PI);
    const off = Math.sin((t*2.1+seed)*Math.PI)*amp*taper;
    pts.push([bx+nx*off, by+ny*off]);
  }
  return pts;
}
function windingChain(idOrder, extra){
  const stops = idOrder.map(id=> id==='ORIGIN' ? [ox,oy] : pt(byId(id)));
  let chain=[stops[0]];
  for(let i=0;i<stops.length-1;i++){
    const [x0,y0]=stops[i], [x1,y1]=stops[i+1];
    const seg = windSegment(x0,y0,x1,y1, 5, 26, i*0.7+0.3);
    chain = chain.concat(seg.slice(1));
  }
  return chain;
}

}

// ── DECLUTTER: nudge pins that sit too close together apart, so every
// icon stays fully visible even when two destinations are near each
// other on the map. Each pin keeps a small dot at its true location and
// a thin connector line to its (slightly shifted) icon. ──
function resolvePinCollisions(nodes, minDist, iterations){
  const arr = nodes.map(n=>({...n}));
  for(let it=0; it<iterations; it++){
    let moved=false;
    for(let i=0;i<arr.length;i++){
      for(let j=i+1;j<arr.length;j++){
        const a=arr[i], b=arr[j];
        let dx=b.x-a.x, dy=b.y-a.y;
        let dist=Math.hypot(dx,dy);
        if(dist < minDist){
          moved=true;
          if(dist < 0.001){ dx=(j-i+1); dy=1; dist=Math.hypot(dx,dy); }
          const push=(minDist-dist)/2;
          const ux=dx/dist, uy=dy/dist;
          if(!a.fixed){ a.x-=ux*push; a.y-=uy*push; }
          if(!b.fixed){ b.x+=ux*push; b.y+=uy*push; }
        }
      }
    }
    if(!moved) break;
  }
  return arr;
}

function makePinGroup(x,y,color,emoji,delay,scale2=1){
  const outer = svgEl('g',{class:'pin', transform:`translate(${x},${y})`});

  const et=svgEl('text',{x:0,y:-19*scale2+5,'text-anchor':'middle','font-size':13*scale2}); et.textContent=emoji;
  body.appendChild(et);
  anim.appendChild(body);
  outer.appendChild(anim);
  return {outer, anim};
}

// thin connector + true-location dot, drawn only when a pin was nudged
function drawAnchorConnector(trueX, trueY, dispX, dispY, color){
  const d = Math.hypot(dispX-trueX, dispY-trueY);
  if(d < 3) return; // barely moved, no need for a connector
  const g = svgEl('g',{opacity:.85});
  g.appendChild(svgEl('line',{x1:trueX,y1:trueY,x2:dispX,y2:dispY, stroke:'#22303a','stroke-width':1.3,'stroke-dasharray':'2,2', opacity:.55}));

}

{

function setViewBox(vb){ svg.setAttribute('viewBox', vb.join(' ')); curVB=vb; }
function animateViewBox(target, dur=650){
  const start=[...curVB], t0=performance.now();
  function step(t){
    const p=Math.min(1,(t-t0)/dur);
    const e=1-Math.pow(1-p,3); // ease-out cubic
    const vb=start.map((s,i)=>s+(target[i]-s)*e);
    setViewBox(vb);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function zoomToPlace(p){
  const size=260;
  const cx = p._px!==undefined ? p._px : p._x;
  const cy = p._py!==undefined ? p._py : p._y;
  let x=cx-size/2, y=cy-size/2;
  x=Math.max(0,Math.min(W-size,x)); y=Math.max(0,Math.min(H-size,y));
  animateViewBox([x,y,size,size]);
}
function zoomOut(){ animateViewBox([...DEFAULT_VB]); }

// ══════════════════════════════════ MODAL / DETAIL ══════════════════════════════════
let currentPlace=null;
const overlay=document.getElementById('overlay'), detail=document.getElementById('detail'), backBtn=document.getElementById('btnBack');

function openPlace(id){

  document.getElementById('mImg').src=p.img;

overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });

document.getElementById('btnExplore').addEventListener('click', ()=>{

    <div class="d-chip gold">${rating}</div>

  document.getElementById('dSejarah').textContent=p.sejarah;
  document.getElementById('dDetail').textContent=p.detail;

  // ── Rute dari titik asal ──
  const distKm = haversineKm(ORIGIN.lat,ORIGIN.lng,p.lat,p.lng);
  const dir = bearingDir(ORIGIN.lat,ORIGIN.lng,p.lat,p.lng);
  const gmapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${ORIGIN.lat},${ORIGIN.lng}&destination=${p.lat},${p.lng}`;
  document.getElementById('dRoute').innerHTML = `
    Berjarak sekitar <b>${distKm.toFixed(1)} km</b> ke arah <b>${dir}</b> dari ${ORIGIN.name}.
    Koordinat lokasi: <b>${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</b>.<br/>
    <a href="${gmapsUrl}" target="_blank" style="color:var(--accent-dark);font-weight:700;text-decoration:underline">
      🧭 Buka rute di Google Maps
    </a>`;

  document.getElementById('dGallery').innerHTML = p.gallery.map((src,i)=>`<img src="${src}" alt="${p.name}" data-idx="${i}">`).join('');
  document.querySelectorAll('#dGallery img').forEach(img=>{
    img.addEventListener('click', ()=> openLightbox(p.gallery, parseInt(img.dataset.idx,10)));
  });

});
backBtn.addEventListener('click', ()=>{
  detail.classList.remove('on');
  backBtn.style.display='none';
  if(currentPlace) overlay.classList.add('on');

// ══════════════════════════════════ GALLERY LIGHTBOX ══════════════════════════════════
let lbGallery=[], lbIndex=0;
const lightbox=document.getElementById('lightbox'), lbImg=document.getElementById('lbImg');
const lbClose=document.getElementById('lbClose'), lbPrev=document.getElementById('lbPrev'), lbNext=document.getElementById('lbNext'), lbCounter=document.getElementById('lbCounter');

function openLightbox(gallery, idx){
  lbGallery=gallery; lbIndex=idx;
  renderLightbox();
  lightbox.classList.add('on');
  lbClose.style.display='flex'; lbPrev.style.display='flex'; lbNext.style.display='flex'; lbCounter.style.display='block';
}
function renderLightbox(){
  lbImg.src = lbGallery[lbIndex];
  lbCounter.textContent = `${lbIndex+1} / ${lbGallery.length}`;
}
function closeLightbox(){
  lightbox.classList.remove('on');
  lbClose.style.display='none'; lbPrev.style.display='none'; lbNext.style.display='none'; lbCounter.style.display='none';
}
lbClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', e=>{ if(e.target===lightbox) closeLightbox(); });
lbPrev.addEventListener('click', ()=>{ lbIndex=(lbIndex-1+lbGallery.length)%lbGallery.length; renderLightbox(); });
lbNext.addEventListener('click', ()=>{ lbIndex=(lbIndex+1)%lbGallery.length; renderLightbox(); });
document.addEventListener('keydown', e=>{
  if(!lightbox.classList.contains('on')) return;
  if(e.key==='Escape') closeLightbox();
  if(e.key==='ArrowLeft') lbPrev.click();
  if(e.key==='ArrowRight') lbNext.click();
});

// ══════════════════════════════════ DOWNLOAD (title + map + legend baked in) ══════════════════════════════════
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),2600); }

function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split(' ');
  let line = '', lines=[];
  words.forEach(w=>{
    const test = line ? line+' '+w : w;
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w; }
    else line = test;
  });
  if(line) lines.push(line);
  lines.forEach((l,i)=> ctx.fillText(l, x, y + i*lineHeight));
  return lines.length;
}

async function downloadMap(type){
  const prevVB=[...curVB];
  setViewBox([...DEFAULT_VB]);
  await new Promise(r=>setTimeout(r,60));
  try{
    const clone = svg.cloneNode(true);
    clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
    const xml = new XMLSerializer().serializeToString(clone);
    const svgBlob = new Blob([xml], {type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = ()=>{
      const scaleF=2;
      const headerH = 96*scaleF;      // title band above the map
      const legendW = 300*scaleF;     // legend panel width, drawn over bottom-left of the map
      const legendPad = 18*scaleF;

      const canvas=document.createElement('canvas');
      canvas.width = W*scaleF;
      canvas.height = H*scaleF + headerH;
      const ctx=canvas.getContext('2d');

      // background fill (also serves as JPG backdrop, no transparency issues)
      ctx.fillStyle = '#fbf7ee';
      ctx.fillRect(0,0,canvas.width,canvas.height);

      // ---- Title band ----
      ctx.fillStyle = '#fbf7ee';
      ctx.fillRect(0,0,canvas.width,headerH);
      // little accent badge circle
      const badgeR = 26*scaleF;
      const badgeCx = 44*scaleF, badgeCy = headerH/2;
      const bgrad = ctx.createLinearGradient(badgeCx-badgeR,badgeCy-badgeR,badgeCx+badgeR,badgeCy+badgeR);
      bgrad.addColorStop(0,'#c1622f'); bgrad.addColorStop(1,'#9c4c22');
      ctx.fillStyle = bgrad;
      ctx.beginPath(); ctx.arc(badgeCx,badgeCy,badgeR,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = `${26*scaleF}px sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🗺️', badgeCx, badgeCy+1);

      ctx.textAlign='left'; ctx.textBaseline='alphabetic';
      ctx.fillStyle = '#22303a';
      ctx.font = `700 ${30*scaleF}px Georgia, 'Fraunces', serif`;
      ctx.fillText('PETA WISATA PIDIE JAYA', badgeCx+badgeR+16*scaleF, headerH*0.44);
      ctx.fillStyle = '#5b6b70';
      ctx.font = `600 ${15*scaleF}px sans-serif`;
      ctx.fillText('Kabupaten Pidie Jaya · Aceh  —  11 Destinasi Wisata', badgeCx+badgeR+16*scaleF, headerH*0.72);
      // divider line
      ctx.strokeStyle = '#e2dcc8'; ctx.lineWidth=1.5*scaleF;
      ctx.beginPath(); ctx.moveTo(0,headerH); ctx.lineTo(canvas.width,headerH); ctx.stroke();

      // ---- Map image ----
      ctx.drawImage(img, 0, headerH, W*scaleF, H*scaleF);

      // ---- Legend panel (bottom-left over the map, like on-screen) ----
      const groups = [{title:'Titik Asal', color:CAT_HEX.museum, items:[ORIGIN.name+' (Museum)']}];
      Object.keys(CAT_META).forEach(catKey=>{
        const list = places.filter(p=>p.cat===catKey);
        if(!list.length) return;
        groups.push({title:CAT_META[catKey].label, color:CAT_HEX[catKey], items:list.map(p=>`${p.id}. ${p.name}`)});
      });

      // measure legend height first
      ctx.font = `700 ${12*scaleF}px sans-serif`;
      let totalLines=0;
      const lineH = 20*scaleF, groupGap = 10*scaleF, textMaxW = legendW - legendPad*2 - 26*scaleF;
      const measured = groups.map(g=>{
        ctx.font = `800 ${10.5*scaleF}px sans-serif`;
        const itemLines = g.items.map(txt=>{
          ctx.font = `600 ${12*scaleF}px sans-serif`;
          // estimate wrapped line count
          const words=txt.split(' '); let line='',n=1;
          words.forEach(w=>{ const test=line?line+' '+w:w; if(ctx.measureText(test).width>textMaxW && line){n++; line=w;} else line=test; });
          return n;
        });
        return {g, itemLines};
      });
      let legendH = 60*scaleF; // header
      measured.forEach(({g,itemLines})=>{
        legendH += 22*scaleF; // group title
        itemLines.forEach(n=> legendH += lineH*n);
        legendH += groupGap;
      });
      legendH = Math.min(legendH, H*scaleF - 40*scaleF);

      const legendX = 20*scaleF, legendY = headerH + H*scaleF - legendH - 20*scaleF;
      // panel background
      ctx.save();
      ctx.shadowColor='rgba(15,25,30,.35)'; ctx.shadowBlur=18*scaleF; ctx.shadowOffsetY=6*scaleF;
      ctx.fillStyle='#fbf7ee';
      roundRect(ctx, legendX, legendY, legendW, legendH, 20*scaleF);
      ctx.fill();
      ctx.restore();

      // panel content
      let cy = legendY + 26*scaleF;
      ctx.textAlign='left';
      ctx.fillStyle='#22303a';
      ctx.font = `700 ${15*scaleF}px Georgia, serif`;
      ctx.fillText('Legenda Destinasi', legendX+legendPad, cy);
      cy += 20*scaleF;
      ctx.fillStyle='#5b6b70';
      ctx.font = `${10.5*scaleF}px sans-serif`;
      ctx.fillText('Jalur: 🛣️ Jalan Utama   🌊 Sungai', legendX+legendPad, cy);
      cy += 24*scaleF;

      measured.forEach(({g,itemLines})=>{
        ctx.fillStyle = g.color;
        ctx.beginPath(); ctx.arc(legendX+legendPad+4*scaleF, cy-4*scaleF, 4*scaleF, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#5b6b70';
        ctx.font = `800 ${10*scaleF}px sans-serif`;
        ctx.fillText(g.title.toUpperCase(), legendX+legendPad+14*scaleF, cy);
        cy += 18*scaleF;
        g.items.forEach((txt,i)=>{
  const idMatch = txt.match(/^(\d+)\./);
  const placeId = idMatch ? parseInt(idMatch[1],10) : null;
  const emojiMatch = places.find(p=>p.id===placeId);
  const iconChar = emojiMatch ? emojiMatch.emoji : (g.title==='Titik Asal' ? '🏛️' : '📍');
  const numLabel = idMatch ? idMatch[1] : '';

  const badgeCx = legendX+legendPad+10*scaleF;
  const badgeCy = cy-4*scaleF;
  const badgeR  = 10*scaleF;

  // lingkaran badge warna kategori
  ctx.fillStyle = g.color;
  ctx.beginPath(); ctx.arc(badgeCx, badgeCy, badgeR, 0, Math.PI*2); ctx.fill();

  // emoji di tengah badge
  ctx.font = `${11*scaleF}px sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(iconChar, badgeCx, badgeCy+0.5*scaleF);

  // badge angka kecil di pojok kanan-bawah
  if(numLabel){
    const nx = badgeCx + badgeR*0.7, ny = badgeCy + badgeR*0.7;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(nx, ny, 5.5*scaleF, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 0.6*scaleF; ctx.stroke();
    ctx.fillStyle = '#22303a';
    ctx.font = `800 ${7*scaleF}px sans-serif`;
    ctx.fillText(numLabel, nx, ny+0.3*scaleF);
  }

  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillStyle='#22303a';
  ctx.font = `600 ${11.5*scaleF}px sans-serif`;
  const label = txt.replace(/^\d+\.\s*/,'');
  const nLines = wrapCanvasText(ctx, label, legendX+legendPad+26*scaleF, cy, textMaxW-4*scaleF, lineH);
  cy += lineH*nLines;
});
        cy += groupGap;
      });

      URL.revokeObjectURL(url);
      const mime = type==='jpg' ? 'image/jpeg' : 'image/png';
      canvas.toBlob(blob=>{
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob);
        a.download=`peta-wisata-pidie-jaya.${type}`;
        a.click();
        showToast('✅ Peta berhasil diunduh sebagai '+type.toUpperCase());
      }, mime, 0.95);
    };
    img.onerror = ()=>showToast('⚠️ Gagal membuat gambar');
    img.src=url;
  } catch(err){
    showToast('⚠️ Gagal mengunduh peta');
  } finally {
    setViewBox(prevVB);
  }
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
document.getElementById('btnPng').addEventListener('click', ()=>downloadMap('png'));
document.getElementById('btnJpg').addEventListener('click', ()=>downloadMap('jpg'));
</script>
